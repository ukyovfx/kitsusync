name: VFX Files legacy activation barrier

on:
  push:
    branches: [codex/kitsu-files-plugin-implementation]
  pull_request:
    branches: [master, codex/vfx-files-auth-route-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inactive-legacy-epoch-barrier:
    name: Inactive legacy epoch SQLite barrier (Linux/CGO)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Run inactive legacy epoch barrier test with CGO SQLite
        env:
          CGO_ENABLED: "1"
        run: go test ./src/api/vfxfiles -run '^TestSignedDeactivationBarrierAdvancesAlreadyInactiveLegacyEpoch$' -count=1 -timeout=120s
