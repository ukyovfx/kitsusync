name: VFX Files legacy activation barrier

on:
  push:
    branches: [codex/kitsu-files-plugin-implementation]
  pull_request:
    branches: [master, codex/vfx-files-auth-route-v1]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inactive-legacy-epoch-barrier:
    name: KitsuSync Go tests with CGO SQLite (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Run all KitsuSync source package tests with CGO SQLite
        env:
          CGO_ENABLED: "1"
        run: go test ./src/... -count=1 -timeout=240s

      - name: Fetch exact VFX Files Plugin test source
        env:
          PLUGIN_HEAD: 40acd19c53708faa5a61234c62fd202c032e0a7c
        run: |
          plugin_root="$RUNNER_TEMP/vfx-files-plugin"
          mkdir -p "$plugin_root"
          git -C "$plugin_root" init
          git -C "$plugin_root" remote add origin https://github.com/ukyovfx/vfx-kitsu-files-plugin.git
          git -C "$plugin_root" fetch --depth=1 origin "$PLUGIN_HEAD"
          git -C "$plugin_root" checkout --detach FETCH_HEAD
          test "$(git -C "$plugin_root" rev-parse HEAD)" = "$PLUGIN_HEAD"

      - name: Prepare isolated Plugin test dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/vfx-plugin-venv"
          "$RUNNER_TEMP/vfx-plugin-venv/bin/python" -m pip install --disable-pip-version-check \
            pytest==9.1.1 sqlalchemy==2.1.4 Flask==3.1.3 Flask-SQLAlchemy==3.1.1 cryptography==50.0.2

      - name: Verify Plugin legacy import against the signed KitsuSync HTTPS barrier
        env:
          CGO_ENABLED: "1"
          VFX_FILES_CROSS_REPO_PLUGIN_ROOT: ${{ runner.temp }}/vfx-files-plugin
          VFX_FILES_CROSS_REPO_TEST_PYTHON: ${{ runner.temp }}/vfx-plugin-venv/bin/python
        run: go test ./src/api/vfxfiles -run '^TestPluginLegacyImportReceivesDurableKitsuSyncBarrierAck$' -count=1 -timeout=180s
