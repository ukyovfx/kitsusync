name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve immutable release identity
        id: identity
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/resolve-release-identity.sh

      - name: Check out exact candidate source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.identity.outputs.source_commit }}

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.21

      - name: Install SQLite build dependencies
        run: |
          # The hosted runner's optional Chrome source can be temporarily
          # inconsistent. It is unrelated to this Go/SQLite build and must not
          # prevent the authoritative CGO validation from starting.
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f -print0 \
            | sudo xargs -0 -r grep -lZ 'dl.google.com/linux/chrome-stable/deb' \
            | sudo xargs -0 -r rm -f
          sudo apt-get update
          sudo apt-get install -y gcc libsqlite3-dev

      - name: Mojibake regression check
        shell: bash
        run: |
          set -euo pipefail
          pattern=$'\u7AB6\u30FB|\u7E67|\u7B0F|\u7ACA|\u96B1|\u8B41|\u8B4C|\u873F|\u7E3A'

          tmp="$(mktemp)"
          cleanup() { rm -f "$tmp"; }
          trap cleanup EXIT

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "$base_ref"
            git diff --name-only -z "origin/$base_ref...HEAD" > "$tmp" || true
          else
            before="${{ github.event.before }}"
            sha="${{ github.sha }}"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
              git diff --name-only -z "$before...$sha" > "$tmp" || true
            fi
          fi

          if [[ ! -s "$tmp" ]]; then
            git ls-files -z > "$tmp"
          fi

          bad=0
          while IFS= read -r -d '' f; do
            [[ -f "$f" ]] || continue
            [[ "$f" == ".github/workflows/build.yml" ]] && continue
            if command -v rg >/dev/null 2>&1; then
              if rg -n -I "$pattern" "$f"; then
                bad=1
              fi
            else
              if grep -Iq . "$f" && grep -n -E "$pattern" "$f"; then
                bad=1
              fi
            fi
          done < "$tmp"

          if [[ "$bad" -ne 0 ]]; then
            echo "Mojibake-like text detected in checked files."
            exit 1
          fi

      - name: go vet
        run: CGO_ENABLED=1 go vet ./src/...

      - name: go test
        run: CGO_ENABLED=1 go test ./src/... -count=1 -timeout=240s

      - name: Prepare CI env.local
        run: |
          cp .env.example .env.local
          cat >> .env.local <<'VARS'
          KITSU_HOSTNAME=http://ci.invalid/
          DISCORD_BOT_TOKEN=ci-placeholder-token
          DISCORD_GUILD_ID=000000000000000000
          FB_PASSWORD=ci-password
          VARS

      - name: Docker Compose config
        env:
          FB_USERNAME: ci-user
          FB_PASSWORD: ci-password
          KITSUSYNC_APP_VERSION: ${{ steps.identity.outputs.version }}
        run: docker compose config -q

      - name: Release hardening contract tests
        run: |
          python3 scripts/test-startup-validation.py
          python3 scripts/test-runtime-state.py
          sudo /usr/bin/python3 scripts/test-restore-state.py
          python3 scripts/test-image-identity.py
          bash scripts/test-release-hardening.sh
          bash scripts/test-release-identity.sh
          bash scripts/test-production-path-contract.sh
          bash scripts/test-bootstrap-security.sh

      - name: Docker Compose build app
        env:
          FB_USERNAME: ci-user
          FB_PASSWORD: ci-password
          KITSUSYNC_APP_VERSION: ${{ steps.identity.outputs.version }}
          KITSUSYNC_IMAGE_TAG: ci-${{ steps.identity.outputs.source_commit }}
        run: |
          docker compose build \
            --build-arg APP_VERSION="${{ steps.identity.outputs.version }}" \
            --build-arg COMMIT_SHA="${{ steps.identity.outputs.source_commit }}" \
            --build-arg BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg BUILD_SOURCE_ID="${{ steps.identity.outputs.source_id }}" \
            --build-arg IMAGE_REVISION="${{ steps.identity.outputs.source_commit }}" \
            --build-arg WORKTREE_DIRTY=false app

      - name: Verify source-build-image provenance
        env:
          FB_USERNAME: ci-user
          FB_PASSWORD: ci-password
          KITSUSYNC_APP_VERSION: ${{ steps.identity.outputs.version }}
          KITSUSYNC_IMAGE_TAG: ci-${{ steps.identity.outputs.source_commit }}
          ARTIFACT_KIND: ${{ steps.identity.outputs.artifact_kind }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
          SOURCE_ID: ${{ steps.identity.outputs.source_id }}
          MERGE_TEST_COMMIT: ${{ steps.identity.outputs.merge_test_commit }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.release_commit }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        run: |
          set -euo pipefail
          image_ref="kitsusync:${KITSUSYNC_IMAGE_TAG}"
          image_id="$(docker image inspect --format '{{.Id}}' "$image_ref")"
          revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_id")"
          source_id="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source-id"}}' "$image_id")"
          version="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image_id")"
          test "$revision" = "$SOURCE_COMMIT"
          test "$source_id" = "$SOURCE_ID"
          test "$version" = "$RELEASE_VERSION"
          IMAGE_ID="$image_id" bash scripts/generate-provenance.sh
          cat provenance.txt

      - name: Build and load-back deployment bundle
        env:
          KITSUSYNC_APP_VERSION: ${{ steps.identity.outputs.version }}
          KITSUSYNC_IMAGE_TAG: ci-${{ steps.identity.outputs.source_commit }}
          ARTIFACT_KIND: ${{ steps.identity.outputs.artifact_kind }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.source_commit }}
          SOURCE_ID: ${{ steps.identity.outputs.source_id }}
          MERGE_TEST_COMMIT: ${{ steps.identity.outputs.merge_test_commit }}
          RELEASE_COMMIT: ${{ steps.identity.outputs.release_commit }}
          RELEASE_VERSION: ${{ steps.identity.outputs.version }}
          RELEASE_TAG: ${{ steps.identity.outputs.artifact_kind == 'release' && format('v{0}', steps.identity.outputs.version) || '' }}
        run: |
          set -euo pipefail
          image_ref="kitsusync:${KITSUSYNC_IMAGE_TAG}"
          image_id="$(docker image inspect --format '{{.Id}}' "$image_ref")"
          mode=normal
          if [[ "$ARTIFACT_KIND" == release && "$RELEASE_TAG" == v0.4.6 ]]; then mode=legacy-migration; fi
          IMAGE_REF="$image_ref" IMAGE_ID="$image_id" DEPLOYMENT_MODE="$mode" \
            bash scripts/build-deployment-bundle.sh

      - name: Docker deployment behavior tests
        env:
          KITSUSYNC_APP_VERSION: ${{ steps.identity.outputs.version }}
          KITSUSYNC_IMAGE_TAG: ci-${{ steps.identity.outputs.source_commit }}
        run: |
          bash scripts/test-deployment-behavior.sh
          KITSUSYNC_RUNTIME_DOCKER_TEST=1 python3 scripts/test-runtime-state.py

      - name: Upload provenance and deployment bundle
        uses: actions/upload-artifact@v4
        with:
          name: kitsusync-deployment-${{ steps.identity.outputs.source_commit }}
          path: |
            provenance.txt
            deployment-bundle/
          if-no-files-found: error

  deployment-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute actual deployment and rollback on isolated fixtures
        run: bash scripts/test-deployment-transaction.sh
