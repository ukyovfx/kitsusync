name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.21

      - name: Install SQLite build dependencies
        run: sudo apt-get update && sudo apt-get install -y gcc libsqlite3-dev

      - name: Mojibake regression check
        shell: bash
        run: |
          set -euo pipefail
          pattern=$'\u7AB6\u30FB|\u7E67|\u7B0F|\u7ACA|\u96B1|\u8B41|\u8B4C|\u873F|\u7E3A'

          tmp="$(mktemp)"
          cleanup() { rm -f "$tmp"; }
          trap cleanup EXIT

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_ref="${{ github.base_ref }}"
            git fetch --no-tags --depth=1 origin "$base_ref"
            git diff --name-only -z "origin/$base_ref...HEAD" > "$tmp" || true
          else
            before="${{ github.event.before }}"
            sha="${{ github.sha }}"
            if [[ -n "$before" && "$before" != "0000000000000000000000000000000000000000" ]]; then
              git diff --name-only -z "$before...$sha" > "$tmp" || true
            fi
          fi

          if [[ ! -s "$tmp" ]]; then
            git ls-files -z > "$tmp"
          fi

          bad=0
          while IFS= read -r -d '' f; do
            [[ -f "$f" ]] || continue
            [[ "$f" == ".github/workflows/build.yml" ]] && continue
            if command -v rg >/dev/null 2>&1; then
              if rg -n -I "$pattern" "$f"; then
                bad=1
              fi
            else
              if grep -Iq . "$f" && grep -n -E "$pattern" "$f"; then
                bad=1
              fi
            fi
          done < "$tmp"

          if [[ "$bad" -ne 0 ]]; then
            echo "Mojibake-like text detected in checked files."
            exit 1
          fi

      - name: go vet
        run: CGO_ENABLED=1 go vet ./src/...

      - name: go test
        run: CGO_ENABLED=1 go test ./src/... -count=1 -timeout=240s

      - name: Prepare CI env.local
        run: |
          cp .env.example .env.local
          cat >> .env.local <<'VARS'
          KITSU_HOSTNAME=http://ci.invalid/
          DISCORD_BOT_TOKEN=ci-placeholder-token
          DISCORD_GUILD_ID=000000000000000000
          FB_PASSWORD=ci-password
          VARS

      - name: Docker Compose config
        env:
          FB_USERNAME: ci-user
          FB_PASSWORD: ci-password
        run: docker compose config -q

      - name: Release hardening contract tests
        run: bash scripts/test-release-hardening.sh

      - name: Docker Compose build app
        env:
          FB_USERNAME: ci-user
          FB_PASSWORD: ci-password
        run: |
          docker compose build \
            --build-arg APP_VERSION="${{ github.event_name == 'pull_request' && '0.4.4' || github.ref_name }}" \
            --build-arg COMMIT_SHA="${GITHUB_SHA}" \
            --build-arg BUILD_TIMESTAMP="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --build-arg BUILD_SOURCE_ID="${GITHUB_SHA}" \
            --build-arg IMAGE_REVISION="${GITHUB_SHA}" \
            --build-arg WORKTREE_DIRTY=false app

      - name: Verify source-build-image provenance
        env:
          FB_USERNAME: ci-user
          FB_PASSWORD: ci-password
        run: |
          set -euo pipefail
          image_id="$(docker compose images -q app)"
          test -n "$image_id"
          revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_id")"
          source_id="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source-id"}}' "$image_id")"
          version="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.version"}}' "$image_id")"
          test "$revision" = "$GITHUB_SHA"
          test "$source_id" = "$GITHUB_SHA"
          test -n "$version"
          printf 'source_commit=%s\nsource_id=%s\nversion=%s\nimage_id=%s\n' "$revision" "$source_id" "$version" "$(docker image inspect --format '{{.Id}}' "$image_id")" > provenance.txt
          cat provenance.txt

      - name: Upload provenance evidence
        uses: actions/upload-artifact@v4
        with:
          name: kitsusync-provenance-${{ github.sha }}
          path: provenance.txt
          if-no-files-found: error
