name: Staging candidate deployment

on:
  workflow_run:
    workflows: [Security Audit]
    types: [completed]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: kitsusync-staging-8091
  cancel-in-progress: true

jobs:
  deploy-candidate:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].base.ref == 'master' &&
      vars.KITSUSYNC_STAGING_AUTODEPLOY == 'enabled'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted deployment tooling
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Require successful exact-SHA CI
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]
          for attempt in $(seq 1 180); do
            runs="$(gh api "repos/$REPOSITORY/actions/runs?head_sha=$CANDIDATE_SHA&per_page=100")"
            ci="$(jq -r '[.workflow_runs[] | select(.name == "CI" and .event == "pull_request" and .head_sha == env.CANDIDATE_SHA)] | sort_by(.run_number) | last // empty | [.status, .conclusion] | @tsv' <<<"$runs")"
            if [[ -z "$ci" ]]; then sleep 10; continue; fi
            read -r status conclusion <<<"$ci"
            if [[ "$status" == completed ]]; then
              [[ "$conclusion" == success ]] || { echo 'STAGING_CI_GATE=FAIL'; exit 1; }
              echo 'STAGING_CI_GATE=PASS'
              exit 0
            fi
            sleep 10
          done
          echo 'STAGING_CI_GATE=TIMEOUT'
          exit 1

      - name: Check one-time staging automation configuration
        env:
          STAGING_HOST: ${{ vars.KITSUSYNC_STAGING_SSH_HOST }}
          TAILSCALE_CLIENT_ID: ${{ vars.KITSUSYNC_TAILSCALE_OIDC_CLIENT_ID }}
          TAILSCALE_AUDIENCE: ${{ vars.KITSUSYNC_TAILSCALE_OIDC_AUDIENCE }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.KITSUSYNC_STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.KITSUSYNC_STAGING_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          for name in STAGING_HOST TAILSCALE_CLIENT_ID TAILSCALE_AUDIENCE STAGING_SSH_PRIVATE_KEY STAGING_SSH_KNOWN_HOSTS; do
            [[ -n "${!name}" ]] || { echo "STAGING_AUTODEPLOY_CONFIG=INCOMPLETE missing=$name"; exit 1; }
          done

      - name: Connect ephemeral GitHub-hosted runner to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ vars.KITSUSYNC_TAILSCALE_OIDC_CLIENT_ID }}
          audience: ${{ vars.KITSUSYNC_TAILSCALE_OIDC_AUDIENCE }}
          tags: tag:github-actions
          version: 1.102.4
          ping: ${{ vars.KITSUSYNC_STAGING_SSH_HOST }}

      - name: Deploy exact verified candidate through the stable Staging helper
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}
          STAGING_HOST: ${{ vars.KITSUSYNC_STAGING_SSH_HOST }}
          STAGING_SSH_PRIVATE_KEY: ${{ secrets.KITSUSYNC_STAGING_SSH_PRIVATE_KEY }}
          STAGING_SSH_KNOWN_HOSTS: ${{ secrets.KITSUSYNC_STAGING_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          ssh_dir="$RUNNER_TEMP/kitsusync-staging-ssh"
          install -d -m 700 "$ssh_dir"
          key_file="$ssh_dir/id_ed25519"
          known_hosts_file="$ssh_dir/known_hosts"
          printf '%s\n' "$STAGING_SSH_PRIVATE_KEY" > "$key_file"
          printf '%s\n' "$STAGING_SSH_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$key_file" "$known_hosts_file"
          eval "$(ssh-agent -s)" >/dev/null
          trap 'ssh-agent -k >/dev/null 2>&1 || true; rm -rf -- "$ssh_dir"' EXIT
          ssh-add "$key_file" >/dev/null
          export KITSUSYNC_STAGING_SSH_HOST="$STAGING_HOST"
          export KITSUSYNC_STAGING_SSH_USER=ukyo_vfx
          export KITSUSYNC_SSH_KNOWN_HOSTS_FILE="$known_hosts_file"
          pwsh -NoProfile -File scripts/deploy-kitsusync-staging-candidate.ps1 -CommitSha "$CANDIDATE_SHA"
