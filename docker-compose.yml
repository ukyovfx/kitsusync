services:
  app:
    build:
      context: .
      args:
        APP_VERSION: "0.4.5"
    restart: unless-stopped
    env_file:
      - .env.local
    volumes:
      - ./conf.toml:/app/conf.toml:ro
      - ./tpl:/app/tpl:ro
      - ./data:/app/data
    environment:
      - APP_ENV=development
      - TZ=Asia/Tokyo
    ports:
      - "127.0.0.1:8090:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
  editor:
    profiles:
      - debug
    image: filebrowser/filebrowser:latest
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - filebrowser_data:/database
      - ./README.md:/srv/README.md:ro
      - ./tpl:/srv/tpl:ro
    environment:
      - PUID=1000
      - PGID=1000
      - FB_USERNAME=${FB_USERNAME}
      - FB_PASSWORD=${FB_PASSWORD}

volumes:
  filebrowser_data:
